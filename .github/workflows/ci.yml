name: Student Management CI

on:
  push:
    branches:
      - main
      - dev
      - staging
      - "feature/**"

  pull_request:
    branches:
      - main
      - dev
      - staging

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check required secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "API_KEY secret is missing"
            exit 1
          fi

          echo "API_KEY secret is available"